name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish WindowLogger/WindowLogger.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish

      - name: Sign executable
        run: |
          Install-Module -Name TrustedSigning -Scope CurrentUser -Force
          Import-Module TrustedSigning
          Invoke-TrustedSigning `
            -Endpoint "https://eus.codesigning.azure.net" `
            -CodeSigningAccountName "FetchitSigning" `
            -CertificateProfileName "Fetchit" `
            -FilesFolderFilter "*.exe" `
            -FilesFolder "publish" `
            -FileDigest SHA256
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/WindowLogger.exe
          generate_release_notes: true
